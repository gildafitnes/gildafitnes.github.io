<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>portfolio — gilda fitnes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' font-family='Arial' font-weight='bold' font-style='italic' fill='%230018ff'>g</text></svg>">
<style>
  :root{
    --azul:#0018ff;
    --u: min(1vw, 0.8vh);
    --ratio: 0.8;                       /* lo fija cada portfolio */
    --ih: min(59.5vh, 74vw);            /* alto de cada pieza */
    --gap: calc(var(--ih) * 0.115);
  }
  @supports (height: 100dvh){ :root{ --u: min(1vw, 0.8dvh); } }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#fff;color:var(--azul);
    font-family:Arial, Helvetica, sans-serif;
    font-weight:700;font-style:italic;
    overflow:hidden;overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}

  /* la tira queda centrada al 45.9% de la altura, como en el boceto */
  .rows{
    position:absolute;left:0;top:0;width:100%;
    height:91.8vh; height:91.8dvh;
    display:flex;align-items:center;
    touch-action:pan-y;cursor:grab;
    user-select:none;-webkit-user-select:none;
  }
  .rows.dragging{cursor:grabbing}
  .row{width:100%;overflow:hidden}
  .track{display:flex;gap:var(--gap);will-change:transform}

  .item{
    flex:0 0 auto;
    height:var(--ih);
    width:calc(var(--ih) * var(--ratio));
    background:#fff;overflow:hidden;
  }
  .item img, .item video{
    width:100%;height:100%;object-fit:cover;display:block;
    pointer-events:none;-webkit-user-drag:none;
  }

  /* área de rebote del boceto: el logo devuelve al inicio */
  .band{
    position:fixed;
    left:28.06%;width:43.33%;
    top:84.44vh; height:13.93vh;
    top:84.44dvh; height:13.93dvh;
    display:block;z-index:5;
  }
  .logo{
    position:absolute;left:0;top:0;white-space:nowrap;
    font-size:calc(4.56 * var(--u));line-height:1;
    transform-origin:left top;will-change:transform;
  }

  .lightbox{
    position:fixed;inset:0;background:#fff;
    display:none;align-items:center;justify-content:center;z-index:20;
  }
  .lightbox.open{display:flex}
  .lightbox figure{
    width:min(92vw, calc(88vh * var(--ratio)));
    height:min(88vh, calc(92vw / var(--ratio)));
  }
  .lightbox img, .lightbox video{width:100%;height:100%;object-fit:contain;display:block}
  .close{
    position:fixed;top:min(3vh,4vw);right:min(4vw,4vh);
    background:none;border:0;padding:.1em .2em;color:var(--azul);
    font-family:Arial, Helvetica, sans-serif;font-weight:700;font-style:italic;
    font-size:min(6vh, 9vw);line-height:1;cursor:pointer;z-index:21;
  }
  .close:focus-visible{outline:3px solid var(--azul)}
</style>
</head>
<body>

<main class="rows" id="rows" aria-label="publicaciones"></main>

<a class="band" id="band" href="index.html" aria-label="volver al inicio">
  <span class="logo" id="logo">gilda fitnes</span>
</a>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="imagen ampliada">
  <button class="close" id="close" aria-label="cerrar">x</button>
  <figure id="lbFigure"></figure>
</div>

<script src="bounce.js"></script>
<script src="marquee.js"></script>
<script>
  marquee({ defaultId: 'portfolio', speed: 58 });
  bounce(document.getElementById('band'), document.getElementById('logo'), 22, 0.77, 0.45);
</script>
</body>
</html>
